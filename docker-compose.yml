version: "3.8"

services:
  ledger:
    image: postgres:16-alpine
    container_name: celesto-ledger
    restart: unless-stopped
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    expose:
      - "5432"
    ports:
      - "5433:5432"
    volumes:
      - ./seeds:/docker-entrypoint-initdb.d:ro
      - ledger-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: celesto-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql://ledger:ledger@ledger:5432/ledger
      - API_PORT=8080
      - CELESTO_PROVIDER=cloud
      - CELESTO_API_KEY=mock-key-cloud
      - CELESTO_BACKEND=firecracker
      - LLM_BASE_URL=https://example-llm-host/v1
      - LLM_API_KEY=mock-llm-key
      - LLM_MODEL=mock-model
      - ENVIRONMENT=development
    depends_on:
      ledger:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  ledger-data:
